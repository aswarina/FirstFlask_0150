<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <title>Form Input Nama</title>
  </head>
  <body>
    <h1>Form Input Nama</h1>

    <p>Silakan masukkan nama kamu.</p>

    <form method="POST" action="/">
      <label for="nama">Nama Lengkap:</label>

      <input
        type="text"
        id="nama"
        name="nama"
        placeholder="Masukkan nama kamu"
      />

      <button type="submit">Kirim</button>
    </form>
  </body>
</html>
